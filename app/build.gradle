plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.samp.mobile'
    compileSdk 35

    // Removemos o bloco de signingConfigs que apontava para o D:\ para evitar o erro de URI
    
    defaultConfig {
        applicationId "com.samp.mobile"
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName "0.8.2.1"

        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    // Versão exata configurada no seu GitHub Actions
    ndkVersion '26.1.10909125' 

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
            pickFirsts += ['lib/**/libGTASA.so', 'lib/**/libsamp.so']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled false
            // O Gradle vai usar a chave de debug padrão do sistema
        }
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }
            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem signingConfig aqui, ele gera o APK "unsigned"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "com.google.android.material:material:1.9.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:30.1.0')
    implementation 'com.google.firebase:firebase-analytics:21.2.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:18.3.5'
    implementation 'com.google.firebase:firebase-messaging:23.1.1'

    // Bibliotecas do Projeto
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'org.ini4j:ini4j:0.5.4'
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation "androidx.lifecycle:lifecycle-process:2.2.0"

    // Hooks e Proteção
    implementation 'com.bytedance.android:shadowhook:1.0.9'
    implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
